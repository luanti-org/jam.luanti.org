<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#1a1e18" />
        <meta name="description" content="" data-copy-content="description" />
        <title data-copy="pageTitle"></title>
        <link rel="icon" href="./assets/luanti.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="./workshop.css" />
        <script type="module" src="./main.ts"></script>
    </head>
    <body>
        <header class="masthead">
            <p class="eyebrow" id="subtext" data-copy="subtext"></p>
            <div class="brand">
                <img src="./assets/luanti.svg" alt="" width="48" height="48" />
                <h1 id="jam-title" data-copy="heading"></h1>
            </div>
            <p id="room-help" class="room-help" data-copy="roomHelp"></p>
        </header>
        <main>
            <section class="workshop" data-copy-aria-label="roomLabel" aria-describedby="room-help">
                <img
                    class="room"
                    src="./assets/room.png"
                    alt=""
                    data-copy-alt="roomAlt"
                    width="320"
                    height="240"
                />
                <button
                    class="hotspot pantry"
                    type="button"
                    data-panel="ingredients-panel"
                    aria-haspopup="dialog"
                    data-copy-aria-label="panels.ingredients-panel.accessibleLabel"
                >
                    <span class="object-art"
                        ><span class="sprite"
                            ><img src="./assets/pantry.png" alt="" width="62" height="173" /></span
                    ></span>
                    <span class="hotspot-label" data-copy="panels.ingredients-panel.hotspot"></span>
                </button>
                <button
                    class="hotspot brews"
                    type="button"
                    data-panel="shelf-panel"
                    aria-haspopup="dialog"
                    data-copy-aria-label="panels.shelf-panel.accessibleLabel"
                >
                    <span class="object-art"
                        ><span class="sprite"
                            ><img src="./assets/potions.png" alt="" width="77" height="50" /></span
                    ></span>
                    <span class="hotspot-label" data-copy="panels.shelf-panel.hotspot"></span>
                    <span id="shelf-new" class="new-badge" data-copy="shelf.new" hidden></span>
                </button>
                <button
                    class="hotspot cauldron"
                    type="button"
                    data-panel="submission-panel"
                    aria-haspopup="dialog"
                    data-copy-aria-label="panels.submission-panel.accessibleLabel"
                >
                    <span class="object-art"
                        ><span class="sprite"
                            ><img src="./assets/cauldron.png" alt="" width="59" height="52" /></span
                    ></span>
                    <span class="hotspot-label" data-copy="panels.submission-panel.hotspot"></span>
                </button>
                <button
                    class="hotspot wizard"
                    id="wizard"
                    type="button"
                    data-panel="rules-panel"
                    aria-haspopup="dialog"
                    data-copy-aria-label="panels.rules-panel.accessibleLabel"
                >
                    <span class="object-art">
                        <span class="sprite">
                            <img
                                class="wizard-idle"
                                src="./assets/wizard.png"
                                alt=""
                                width="200"
                                height="240"
                            />
                            <img
                                class="wizard-talk"
                                src="./assets/wizard_talk.png"
                                alt=""
                                width="200"
                                height="240"
                            />
                        </span>
                    </span>
                    <span class="hotspot-label" data-copy="panels.rules-panel.hotspot"></span>
                </button>
                <button
                    id="speech"
                    class="speech"
                    type="button"
                    data-copy-aria-label="speechLabel"
                    hidden
                ></button>
                <img
                    class="crt-grain"
                    src="./assets/noise.svg"
                    alt=""
                    aria-hidden="true"
                    width="320"
                    height="240"
                />
                <dialog id="workshop-panel" aria-labelledby="panel-title">
                    <img
                        class="crt-grain"
                        src="./assets/noise.svg"
                        alt=""
                        aria-hidden="true"
                        width="320"
                        height="240"
                    />
                    <header class="panel-header">
                        <h2 id="panel-title"></h2>
                        <div class="panel-actions">
                            <button
                                id="refresh-shelf"
                                class="panel-icon"
                                type="button"
                                data-copy-aria-label="shelf.refresh"
                                hidden
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M20 4v6h-6M20 10a8 8 0 1 0-2 7" />
                                </svg>
                            </button>
                            <button
                                id="close-panel"
                                class="close-panel panel-icon"
                                type="button"
                                data-copy-aria-label="closeLabel"
                                autofocus
                            ></button>
                        </div>
                    </header>
                    <div class="panel-body">
                        <section id="rules-panel" data-theme="parchment" hidden>
                            <p id="wizard-remark" class="wizard-remark"></p>
                            <div id="rules-content" data-prose="rules"></div>
                        </section>
                        <section id="ingredients-panel" data-theme="wood" hidden>
                            <div id="pantry-content" data-prose="pantry"></div>
                            <h3 data-copy="themesHeading"></h3>
                            <div id="theme-ingredients" class="ingredient-shelf"></div>
                            <h3 data-copy="resourcesHeading"></h3>
                            <div id="resource-ingredients" class="ingredient-shelf"></div>
                        </section>
                        <section id="submission-panel" data-theme="iron" hidden>
                            <div id="submission-entry">
                                <div id="cauldron-content" data-prose="cauldron"></div>
                                <form id="submit-form">
                                    <input
                                        id="repository"
                                        type="url"
                                        required
                                        maxlength="2048"
                                        data-copy-aria-label="submission.repositoryLabel"
                                        data-copy-placeholder="submission.repositoryPlaceholder"
                                        aria-describedby="cauldron-content"
                                        autocomplete="url"
                                        spellcheck="false"
                                    />
                                    <button id="submit-button" class="primary" type="submit">
                                        <span class="spinner" aria-hidden="true" hidden></span>
                                        <span id="submit-label" data-copy="submission.submit"></span>
                                    </button>
                                </form>
                                <p
                                    id="inspection-help"
                                    class="fine-print"
                                    data-copy="submission.inspectionHelp"
                                    role="status"
                                    hidden
                                ></p>
                                <p id="submit-result" role="status"></p>
                            </div>
                            <div id="submission-receipt" hidden>
                                <p id="status" role="status" tabindex="-1"></p>
                                <div class="status-actions">
                                    <button
                                        id="copy-status-link"
                                        type="button"
                                        data-copy="submission.copyLink"
                                    ></button>
                                    <button
                                        id="refresh-status"
                                        type="button"
                                        data-copy="submission.refresh"
                                    ></button>
                                    <button
                                        id="another-game"
                                        class="primary"
                                        type="button"
                                        data-copy="submission.another"
                                    ></button>
                                </div>
                                <p id="status-action-result" class="fine-print" role="status"></p>
                            </div>
                        </section>
                        <section id="shelf-panel" data-theme="wood" hidden>
                            <p id="shelf-result" role="status" hidden></p>
                            <div id="shelf-list"></div>
                        </section>
                    </div>
                </dialog>
            </section>
            <p id="schedule">
                <time data-event-value="startsAt"></time> – <time data-event-value="endsAt"></time> ·
                <span data-event-value="engine"></span>
            </p>
            <noscript
                ><p><a href="./guide.html">{{textGuideLabel}}</a></p></noscript
            >
        </main>
        <footer class="page-footer">
            <ul id="footer-links" role="list" data-copy-aria-label="footer.accessibleLabel">
                <li>
                    <a id="copyright" data-copy="footer.copyright" data-copy-href="footer.copyrightUrl"></a>
                </li>
                <li id="text-version-item">
                    <a id="plain-version" href="./guide.html" data-copy="footer.plainTextLabel"></a>
                </li>
                <li>
                    <label class="motion-switch"
                        ><input id="reduce-motion" type="checkbox" role="switch" /><span
                            data-copy="footer.motionLabel"
                        ></span
                    ></label>
                </li>
            </ul>
        </footer>
        <svg class="media-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <symbol id="icon-tool" viewBox="0 0 24 24">
                <path d="m14 7 3 3M5 19l-1-1 8-8a6 6 0 0 1 8-7l-4 4 1 3 3 1 3-4a6 6 0 0 1-8 7l-8 8z"></path>
            </symbol>
            <symbol id="icon-texture" viewBox="0 0 24 24">
                <path d="M3 3h18v18H3zM3 17l6-6 4 4 3-3 5 5"></path>
                <circle cx="16" cy="8" r="2"></circle>
            </symbol>
            <symbol id="icon-model" viewBox="0 0 24 24">
                <path d="m12 2 9 5v10l-9 5-9-5V7zm0 10L3 7m9 5 9-5m-9 5v10"></path>
            </symbol>
            <symbol id="icon-sound" viewBox="0 0 24 24">
                <path d="m3 9 5 0 5-5v16l-5-5H3zm14-2a7 7 0 0 1 0 10m3-13a11 11 0 0 1 0 16"></path>
            </symbol>
            <symbol id="icon-license" viewBox="0 0 24 24">
                <path
                    d="M12 3v18m-5 0h10M3 7h18M6 7l-4 8h8zm12 0-4 8h8zM2 15a4 4 0 0 0 8 0m4 0a4 4 0 0 0 8 0"
                ></path>
            </symbol>
        </svg>
    </body>
</html>
