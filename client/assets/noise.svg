<!-- A fixed CRT grain sample; CSS moves this image rather than recomputing turbulence each frame. -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="1" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <path fill="#fff" d="M0 0h320v240H0z" filter="url(#grain)"/>
</svg>
